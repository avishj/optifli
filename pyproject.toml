[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "optifli"
version = "0.0.1"
description = "CLI-first flight optimization engine for multi-city itineraries."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [{ name = "Avish Jha", email = "avish.j@pm.me" }]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "cyclopts>=4.10.2",
    "pydantic-settings>=2.14.0",
    "rich>=15.0.0",
    "airportsdata>=20260315",
    "flights>=0.8.4",
]

[project.scripts]
optifli = "optifli.cli:entrypoint"

[project.urls]
Changelog = "https://github.com/avishj/optifli/blob/main/CHANGELOG.md"
Documentation = "https://avishj.github.io/optifli"
Homepage = "https://github.com/avishj/optifli"
Issues = "https://github.com/avishj/optifli/issues"
Repository = "https://github.com/avishj/optifli"

[dependency-groups]
dev = [
    "commitizen>=4.13.10",
    "complexipy>=5.3.0",
    "mkdocstrings-python>=2.0.3",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-github-actions-annotate-failures>=0.4.0",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.11",
    "ty>=0.0.32",
    "zensical>=0.0.33",
    "tzdata>=2026.1; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/optifli"]

[tool.uv]
python-preference = "managed"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
    "COM812", # conflicts with formatter
    "ISC001", # conflicts with formatter
]
select = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["optifli"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",    # annotations not required in tests
    "ARG",    # unused arguments (fixtures)
    "D",      # docstrings not required in tests
    "DTZ",    # naive datetimes needed to test tz validation
    "FBT",    # boolean traps in tests
    "PLR2004", # magic values in tests
    "S101",   # assert allowed in tests
]
"tests/e2e/*.py" = [
    "S603",   # subprocess.run is intentional in CLI end-to-end tests
    "S607",   # console scripts from PATH are intentional in CLI end-to-end tests
]

[tool.ty.rules]
missing-argument = "ignore"      # Pydantic model_post_init / validators
unknown-argument = "ignore"      # pydantic-settings underscore kwargs
no-matching-overload = "ignore"  # dict.get in model validators
invalid-assignment = "ignore"    # dict mutations in model validators
invalid-return-type = "ignore"   # model validator return types
invalid-argument-type = "ignore" # Pydantic coerces dicts/strings to models

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = ["error"]
markers = [
    "e2e: end-to-end tests invoking the installed CLI via subprocess",
    "integration: tests exercising multiple components together (e.g. CliRunner)",
    "unit: fast isolated tests with no external dependencies",
]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 60
xfail_strict = true

[tool.coverage.run]
branch = true
core = "ctrace"
parallel = true
patch = ["subprocess"]
relative_files = true
source = ["optifli"]

[tool.coverage.report]
exclude_also = [
    "@overload",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
fail_under = 70
show_missing = true
skip_empty = true

[tool.commitizen]
tag_format = "v$version"
update_changelog_on_bump = true
version = "0.0.1"
version_files = ["pyproject.toml:version"]
